    <style>
      /* ==========================================================================
         LUXURY / PRESTIGE COLOR PALETTE & STYLES
         Navy (#001B48), Gold (#C1A35F), White (#FFFFFF), Silver (#E5E7EB)
         ========================================================================== */
      :root {
        --color-bg-white: #FFFFFF;
        --color-navy: #001B48;
        --color-navy-light: #0A2863;
        --color-gold: #C1A35F;
        --color-gold-light: #F4E8C1;
        --color-silver: #E5E7EB;
        --color-silver-dark: #9CA3AF;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #FFFFFF;
        color: var(--color-navy);
        overflow-x: hidden;
      }

      .font-serif-display {
        font-family: Georgia, 'Playfair Display', serif;
      }

      /* Subtle Diagonal Background Pattern */
      .bg-diagonal-pattern {
        background-image: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 40px,
          rgba(193, 163, 95, 0.08) 40px,
          rgba(193, 163, 95, 0.08) 41px
        );
      }

      /* Floating Ambient Glows */
      .glow-gold {
        background: radial-gradient(circle, rgba(193, 163, 95, 0.18) 0%, rgba(255,255,255,0) 70%);
      }
      .glow-navy {
        background: radial-gradient(circle, rgba(0, 27, 72, 0.1) 0%, rgba(255,255,255,0) 70%);
      }

      /* Premium Card Glassmorphism */
      .card-premium {
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(193, 163, 95, 0.35);
        box-shadow: 0 30px 60px -15px rgba(0, 27, 72, 0.12), 0 0 25px 0 rgba(193, 163, 95, 0.12);
      }

      /* Gold Accent Line */
      .gold-divider {
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, #C1A35F 50%, transparent 100%);
      }

      /* Custom Slide Animations */
      .slide-enter {
        animation: slideInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .slide-exit {
        animation: slideOutUp 0.4s cubic-bezier(0.7, 0, 0.84, 0) forwards;
      }

      @keyframes slideInUp {
        0% {
          opacity: 0;
          transform: translateY(24px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes slideOutUp {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-20px) scale(0.96);
        }
      }

      /* Crown Pulse Animation */
      @keyframes floatCrown {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(2deg); }
      }
      .animate-crown {
        animation: floatCrown 3s ease-in-out infinite;
      }

      /* Luxury Button Styling */
      .btn-gold {
        background: #001B48;
        color: #FFFFFF;
        border: 1px solid #C1A35F;
        letter-spacing: 0.08em;
        box-shadow: 0 6px 20px rgba(0, 27, 72, 0.2);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn-gold:hover {
        background: #0A2863;
        border-color: #D6BA7A;
        box-shadow: 0 8px 25px rgba(193, 163, 95, 0.35);
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #FFFFFF;
        color: #001B48;
        border: 1px solid rgba(0, 27, 72, 0.2);
        letter-spacing: 0.06em;
        transition: all 0.25s ease;
      }
      .btn-secondary:hover {
        border-color: #C1A35F;
        background: rgba(193, 163, 95, 0.05);
        color: #001B48;
      }

      /* Custom Checkbox/Radio Cards */

        border: 1px solid rgba(0, 27, 72, 0.12);

        border-color: #C1A35F;
        background-color: rgba(193, 163, 95, 0.08);
        box-shadow: 0 0 0 2px rgba(193, 163, 95, 0.25);
      }

      /* ==========================================================================
         3. UTILITIES
         Helper functions
         ========================================================================== */
      function formatDate(dateString) {
        if (!dateString) return "-";
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateString).toLocaleDateString('id-ID', options);
      }

      function showToast(message) {
        const toast = document.getElementById('toastAlert');
        const toastMsg = document.getElementById('toastMessage');
        toastMsg.textContent = message;
        toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
        toast.classList.add('opacity-100', 'translate-y-0');

        setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
        }, 3000);
      }

      function triggerConfetti() {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#C1A35F', '#001B48', '#F4E8C1', '#FFFFFF', '#E5E7EB']
          });
        }
      }

      /* ==========================================================================
         4. UI & SLIDES RENDERING
         Pure functions generating step DOM templates
         ========================================================================== */
      function renderStepContent(step) {
        const container = document.getElementById('contentContainer');
        container.innerHTML = '';

        let html = '';

        switch(step) {
          case 0: // LOADING SCREEN
            html = `
              <div class="text-center py-12 space-y-6 slide-enter">
                <div class="w-20 h-20 mx-auto rounded-3xl bg-[#001B48] border-2 border-[#C1A35F] flex items-center justify-center shadow-2xl animate-crown">
                  <i data-lucide="crown" class="w-10 h-10 text-[#C1A35F]"></i>
                </div>
                <div class="space-y-2">
                  <h2 class="text-2xl font-bold font-serif-display text-[#001B48]">${CONFIG.title}</h2>
                  <p class="text-xs text-[#C1A35F] font-semibold uppercase tracking-widest">Preparing something special...</p>
                </div>
                <!-- Progress Bar -->
                <div class="w-48 h-2 bg-slate-100 rounded-full mx-auto overflow-hidden border border-[#C1A35F]/30">
                  <div id="loadingBar" class="h-full bg-gradient-to-r from-[#001B48] via-[#C1A35F] to-[#F4E8C1] w-0 transition-all duration-1000 ease-out"></div>
                </div>
              </div>
            `;
            break;

          case 1: // PERKENALAN
            html = `
              <div class="space-y-6 text-center slide-enter">
                <span class="inline-block py-1 px-4 rounded-full bg-[#FDFBF7] border border-[#C1A35F]/40 text-[#C1A35F] text-xs font-semibold uppercase tracking-wider">${CONFIG.perkenalan.subtitle}</span>
                <h2 class="text-3xl font-extrabold font-serif-display text-[#001B48] leading-tight">${CONFIG.perkenalan.title}</h2>
                <div class="gold-divider w-24 mx-auto"></div>
                <p class="text-slate-600 leading-relaxed text-base">${CONFIG.perkenalan.description}</p>
                <div class="pt-4">
                  <button onclick="nextStep()" class="btn-gold w-full py-3.5 px-6 rounded-2xl font-semibold flex items-center justify-center gap-2">
                    Lanjutkan <i data-lucide="arrow-right" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            `;
            break;

          case 2: // KALIMAT A
            html = `

      function updateFooterAndProgress() {
        const dotsContainer = document.getElementById('stepProgressDots');
        const footerPageNum = document.getElementById('footerPageNum');
        
        if (dotsContainer) {
          dotsContainer.innerHTML = '';
          const maxDots = 8;
          for (let i = 1; i <= maxDots; i++) {
            const dot = document.createElement('div');
            const isActive = Math.ceil((STATE.currentStep / STATE.totalSteps) * maxDots) >= i;
            dot.className = `w-1.5 h-1.5 rounded-full transition-all duration-300 ${isActive ? 'bg-[#C1A35F] w-3' : 'bg-slate-200'}`;
            dotsContainer.appendChild(dot);
          }
        }

        if (footerPageNum) {
          footerPageNum.textContent = `${STATE.currentStep} / ${STATE.totalSteps}`;
        }
      }

        STATE.quiz1Text = choiceText;
        renderStepContent(6);
      }

      function submitQuiz1() {
        if (!STATE.quiz1Choice) {
          showToast("Mohon pilih salah satu jawaban kuis dulu ya! 😊");
          return;
        }
        nextStep();
      }

      function selectQuiz2(choiceId, choiceText) {
        STATE.quiz2Choice = choiceId;
        STATE.quiz2Text = choiceText;
        renderStepContent(8);
      }

      function submitQuiz2() {
        if (!STATE.quiz2Choice) {
          showToast("Mohon pilih salah satu jawaban kuis dulu ya! 😊");
          return;
        }
        nextStep();
      }

      /* Location Selection Helper */
      function selectLocation(locId, locTitle) {
        STATE.selectedLocationChoice = locId;
        STATE.selectedLocationText = locTitle;
        renderStepContent(14);
      }

      /* Date & Time Validation */
      function validateAndGoToTime() {
        const inputDate = document.getElementById('inputDate');
        if (inputDate && inputDate.value) {
          STATE.selectedDate = inputDate.value;
        }
        if (!STATE.selectedDate) {
          showToast("Mohon pilih tanggal terlebih dahulu ya! 📅");
          return;
        }
        nextStep();
      }

      function validateAndGoToLocation() {
        const inputTime = document.getElementById('inputTime');
        if (inputTime && inputTime.value) {
          STATE.selectedTime = inputTime.value;
        }
        if (!STATE.selectedTime) {
          STATE.selectedTime = "16:00";
        }
        nextStep();
      }

      /* ==========================================================================
         6. PROPOSAL (YES / NO BUTTON BEHAVIOR)
         Smoothly shrinks and moves NO button strictly inside card/bounds
         ========================================================================== */
      function handleYesClick() {
        triggerConfetti();
        goToStep(12); // Go to Date Picker
      }

      function handleNoClick() {
        STATE.noClickCount++;

        const noBtn = document.getElementById('btnNo');
        const yesBtn = document.getElementById('btnYes');
        const boundsArea = document.getElementById('btnBoundsArea');
        const msgContainer = document.getElementById('noMsgContainer');

        if (!noBtn || !boundsArea) return;

        // Make NO button absolute upon first click so it can teleport freely
        if (noBtn.style.position !== 'absolute') {
          noBtn.style.position = 'absolute';
        }

        // Display corresponding response message from CONFIG
        if (msgContainer && CONFIG.noResponses[STATE.noClickCount - 1]) {
          msgContainer.textContent = CONFIG.noResponses[STATE.noClickCount - 1];
        }

        // Stronger shrinking ratio with each click (down to minimum 0.25)
        const scaleFactor = Math.max(0.25, 1 - (STATE.noClickCount * 0.08));
        noBtn.style.transform = `scale(${scaleFactor})`;

        // Make YES button grow enticingly as NO button shrinks!
        if (yesBtn) {
          const yesScale = Math.min(1.35, 1 + (STATE.noClickCount * 0.04));
          yesBtn.style.transform = `scale(${yesScale})`;
        }

        // Always ensure NO button is on top (z-30) and interactive
        noBtn.style.zIndex = '30';

        // Teleport smoothly to random position inside boundsArea without overlapping yesBtn
        const areaRect = boundsArea.getBoundingClientRect();
        const yesRect = yesBtn ? yesBtn.getBoundingClientRect() : null;

        const noWidth = (noBtn.offsetWidth || 90) * scaleFactor;
        const noHeight = (noBtn.offsetHeight || 40) * scaleFactor;

        const padding = 10;
        const maxX = Math.max(10, areaRect.width - noWidth - padding * 2);
        const maxY = Math.max(10, areaRect.height - noHeight - padding * 2);

        let randomX = padding;
        let randomY = padding;
        let foundValid = false;
        let attempts = 0;

        while (!foundValid && attempts < 40) {
          attempts++;
          randomX = padding + Math.random() * maxX;
          randomY = padding + Math.random() * maxY;

          if (yesRect && areaRect) {
            const noLeftAbs = areaRect.left + randomX;
            const noTopAbs = areaRect.top + randomY;
            const noRightAbs = noLeftAbs + noWidth;
            const noBottomAbs = noTopAbs + noHeight;

            // Generous safety gap (24px) around YES button so it NEVER covers "Mau Banget!"
            const safety = 24;
            const yesLeft = yesRect.left - safety;
            const yesRight = yesRect.right + safety;
            const yesTop = yesRect.top - safety;
            const yesBottom = yesRect.bottom + safety;

            const isOverlapping = !(noRightAbs < yesLeft || noLeftAbs > yesRight || noBottomAbs < yesTop || noTopAbs > yesBottom);
            if (!isOverlapping) {
              foundValid = true;
            }
          } else {
            foundValid = true;
          }
        }

        // Fallback if random sampling fails to find a spot: force to corners outside YES button
        if (!foundValid && yesRect && areaRect) {
          const yesCenterRelX = (yesRect.left + yesRect.width / 2) - areaRect.left;
          if (yesCenterRelX > areaRect.width / 2) {
            randomX = padding; // move to far left
          } else {
            randomX = Math.max(padding, areaRect.width - noWidth - padding); // move to far right
          }
          randomY = Math.max(padding, areaRect.height - noHeight - padding);
        }

        noBtn.style.left = `${randomX}px`;
        noBtn.style.top = `${randomY}px`;

        // Check if click count reached 10
        if (STATE.noClickCount >= 10) {
          showPopupPP();
        }
      }

      function showPopupPP() {
        const modal = document.getElementById('popupModalPP');
        const title = document.getElementById('popupTitle');
        const desc = document.getElementById('popupDesc');
        const btnBack = document.getElementById('btnPopupBack');
        const btnNextTime = document.getElementById('btnPopupNextTime');

        if (title) title.textContent = CONFIG.popupPP.title;
        if (desc) desc.textContent = CONFIG.popupPP.description;
        if (btnBack) btnBack.textContent = CONFIG.popupPP.btnBack;
        if (btnNextTime) btnNextTime.textContent = CONFIG.popupPP.btnNextTime;

        if (modal) {
          modal.classList.remove('opacity-0', 'pointer-events-none');
          modal.classList.add('opacity-100');
        }

        if (btnBack) {
          btnBack.onclick = () => {
            closePopupPP();
            // Reset NO click state
            STATE.noClickCount = 0;
            renderStepContent(11);
          };
        }

        if (btnNextTime) {
          btnNextTime.onclick = () => {
            closePopupPP();
            goToStep(99); // Exit page ZZ
          };
        }
      }

      function closePopupPP() {
        const modal = document.getElementById('popupModalPP');
        if (modal) {
          modal.classList.remove('opacity-100');
          modal.classList.add('opacity-0', 'pointer-events-none');
        }
      }

      /* ==========================================================================
         7. SUBMIT & API CALL
         Sends data payload to Google Apps Script Backend (Code.gs)
         ========================================================================== */
      async function submitAllData() {
        // Validation check
        if (!STATE.quiz1Choice) {
          showToast("Kuis 1 belum diisi!");
          return;
        }
        if (!STATE.quiz2Choice) {
          showToast("Kuis 2 belum diisi!");
          return;
        }
        if (!STATE.selectedDate) {
          showToast("Tanggal belum dipilih!");
          return;
        }
        if (!STATE.selectedTime) {
          showToast("Waktu belum dipilih!");
          return;
        }
        if (!STATE.selectedLocationChoice) {
          showToast("Lokasi belum dipilih!");
          return;
        }

        const payload = {
          status: "Mau Banget!",
          quiz1: {
            choice: STATE.quiz1Choice,
            text: STATE.quiz1Text
          },
          quiz2: {
            choice: STATE.quiz2Choice,
            text: STATE.quiz2Text
          },
          date: STATE.selectedDate,
          time: STATE.selectedTime,
          location: {
            choice: STATE.selectedLocationChoice,
            text: STATE.selectedLocationText
          },
          note: STATE.userNote || "-",
          submittedAt: new Date().toISOString()
        };

        STATE.isSubmitting = true;
        showToast("Mengirim konfirmasi... ⏳");

        try {
          if (CONFIG.apiUrl && CONFIG.apiUrl !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
            await fetch(CONFIG.apiUrl, {
              method: "POST",
              mode: "no-cors", // Google Apps Script Web App standard mode
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(payload)
            });
          } else {
            console.log("Mock Submit Payload:", payload);
          }
        } catch (err) {
          console.warn("API Call note:", err);
        } finally {
          STATE.isSubmitting = false;
          triggerConfetti();
          goToStep(15); // Go to Success Screen
        }
      }

      async function submitNoData() {
        const payload = {
          status: "Lain Kali Saja",
          quiz1: {
            choice: STATE.quiz1Choice || "-",
            text: STATE.quiz1Text || "-"
          },

          },

          time: "-",

            choice: "-",
            text: "-"
          },
          note: STATE.userNote || "-",

        };

        STATE.isSubmitting = true;
        showToast("Mengirim tanggapanmu... ⏳");

        try {
          if (CONFIG.apiUrl && CONFIG.apiUrl !== "https://script.google.com/macros/s/AKfycbxjP5vLD7sGiJ5SPHTHnomfvb7KvGua9gfPGwkGwirs0IhyfyOfXeIhzmI4F1xdnmyr/exec") {
            await fetch(CONFIG.apiUrl, {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(payload)
            });
          } else {
            console.log("Mock Submit NO Payload:", payload);
          }
        } catch (err) {
          console.warn("API Call note:", err);
        } finally {
          STATE.isSubmitting = false;
          STATE.noSubmitted = true;
          showToast("Tanggapan & pesan berhasil terkirim! Terima kasih ❤️");
          renderStepContent(99);
        }
      }

      /* ==========================================================================
         8. INITIALIZATION & LOADING SIMULATION
         ========================================================================== */
      window.addEventListener('DOMContentLoaded', () => {
        // Start on Loading screen
        renderStepContent(0);

        // Animate loading bar and auto-advance to Slide 1
        setTimeout(() => {
          const bar = document.getElementById('loadingBar');
          if (bar) bar.style.width = '100%';
        }, 100);

        setTimeout(() => {
          goToStep(1); // Auto transition to Perkenalan
        }, 1600);
      });
    </script>
