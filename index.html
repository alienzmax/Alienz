<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirim Pesan ke Telegram Bot 🚀</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #0088cc;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    textarea {
      resize: vertical;
      height: 100px;
    }
    button {
      width: 100%;
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background-color: #006699;
    }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Kirim Pesan Bot Telegram 🤖</h2>
    
    <form id="telegramForm">
      <div class="form-group">
        <label for="token">Bot Token 🔑</label>
        <input type="text" id="token" placeholder="Masukkan Bot Token Anda..." required>
      </div>

      <div class="form-group">
        <label for="chatId">Chat ID 🆔</label>
        <input type="text" id="chatId" placeholder="Masukkan Chat ID Anda..." required>
      </div>

      <div class="form-group">
        <label for="message">Pesan 💬</label>
        <textarea id="message" placeholder="Tuliskan pesan di sini..." required></textarea>
      </div>

      <button type="submit" id="btnSubmit">Kirim Pesan 📤</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    document.getElementById('telegramForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const token = document.getElementById('token').value.trim();
      const chatId = document.getElementById('chatId').value.trim();
      const message = document.getElementById('message').value.trim();
      const statusDiv = document.getElementById('status');
      const btnSubmit = document.getElementById('btnSubmit');

      // Tampilkan indikator loading
      statusDiv.style.display = 'block';
      statusDiv.className = '';
      statusDiv.style.backgroundColor = '#e2e3e5';
      statusDiv.style.color = '#383d41';
      statusDiv.innerText = 'Sedang mengirim pesan... ⏳';
      btnSubmit.disabled = true;

      const url = `https://api.telegram.org/bot${token}/sendMessage`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: chatId,
            text: message,
            parse_mode: 'HTML'
          })
        });

        const data = await response.json();

        if (data.ok) {
          statusDiv.className = 'success';
          statusDiv.innerText = 'Pesan berhasil terkirim ke Telegram! 🎉';
          document.getElementById('message').value = ''; // Kosongkan form pesan
        } else {
          statusDiv.className = 'error';
          statusDiv.innerText = 'Gagal: ' + (data.description || 'Token atau Chat ID salah!') + ' ❌';
        }
      } catch (error) {
        console.error('Error:', error);
        statusDiv.className = 'error';
        statusDiv.innerText = 'Terjadi kesalahan jaringan atau koneksi! ⚠️';
      } finally {
        btnSubmit.disabled = false;
      }
    });
  </script>

</body>
</html>
